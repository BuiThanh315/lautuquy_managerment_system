<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quản lý Thực đơn — Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

<div id="sidebar-overlay" class="sidebar-overlay"></div>

<div class="app-shell">
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img th:src="@{/images/logo.png}" alt="Lẩu Tứ Quý Logo" class="brand-logo-img"/>
            <div class="brand-name">Lẩu Tứ Quý</div>
            <div class="brand-subtitle">Restaurant Management</div>
        </div>
        <div class="sidebar-nav">
            <div class="nav-section-title">Quản trị viên</div>
            <a th:href="@{/admin/accounts}" class="nav-item">
                <i class="bi bi-people-fill nav-icon"></i><span>Tài khoản</span>
            </a>
            <a th:href="@{/admin/categories}" class="nav-item">
                <i class="bi bi-grid-3x3-gap-fill nav-icon"></i><span>Danh mục</span>
            </a>
            <a th:href="@{/admin/dishes}" class="nav-item active">
                <i class="bi bi-egg-fried nav-icon"></i><span>Thực đơn</span>
            </a>
            <a th:href="@{/admin/tables}" class="nav-item">
                <i class="bi bi-table nav-icon"></i><span>Bàn ăn</span>
            </a>
            <a th:href="@{/admin/feedbacks}" class="nav-item">
                <i class="bi bi-chat-dots-fill nav-icon"></i><span>Phản hồi</span>
            </a>
            <a th:href="@{/admin/dashboard}" class="nav-item">
                <i class="bi bi-bar-chart-fill nav-icon"></i><span>Báo cáo</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                <div class="user-avatar">
                    <span sec:authentication="name" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">A</span>
                </div>
                <div>
                    <div style="font-size:0.85rem; font-weight:600; color:var(--clr-text-primary);" th:text="${#authentication.name}">Admin</div>
                    <div style="font-size:0.7rem; color:var(--clr-gold);">ADMIN</div>
                </div>
            </div>
            <form th:action="@{/auth/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-secondary btn-sm btn-block" style="justify-content:center;">
                    <i class="bi bi-box-arrow-left"></i> Đăng xuất
                </button>
            </form>
        </div>
    </nav>

    <div class="main-content">
        <header class="topbar">
            <div style="display:flex; align-items:center; gap:16px;">
                <button id="sidebar-toggle" class="btn btn-secondary btn-sm" style="display:none; padding:8px 10px;">
                    <i class="bi bi-list" style="font-size:1.2rem;"></i>
                </button>
                <div class="topbar-title">Quản lý Thực đơn</div>
            </div>
            <div class="topbar-user">
                <span style="font-size:0.8rem; color:var(--clr-text-muted);" th:text="'Xin chào, ' + ${#authentication.name}"></span>
            </div>
        </header>

        <main class="page-content">
            <div th:if="${successMessage}" class="alert alert-success" data-auto-dismiss="true">
                <i class="bi bi-check-circle-fill"></i><span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger" data-auto-dismiss="true">
                <i class="bi bi-exclamation-circle-fill"></i><span th:text="${errorMessage}"></span>
            </div>

            <div class="grid-3 mb-xl">
                <!-- Form Thêm Món / Chỉnh Sửa Món -->
                <div class="card" style="grid-column: span 1;">
                    <div class="card-header">
                        <h2 class="card-title" id="formCardTitle"><i class="bi bi-plus-circle-fill" style="color:var(--clr-gold);"></i> Thêm Món Ăn</h2>
                    </div>
                    <div class="card-body">
                        <form id="dishForm" th:action="@{/admin/dishes}" method="post" th:object="${dishRequest}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" id="dishId" th:field="*{id}"/>

                            <div class="form-group">
                                <label class="form-label" for="categoryId">Danh mục</label>
                                <select id="categoryId" th:field="*{categoryId}" class="form-control" required>
                                    <option value="">-- Chọn danh mục --</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="name">Tên món ăn</label>
                                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="VD: Lẩu Thái chua cay..." required/>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="price">Giá bán (VNĐ)</label>
                                <input type="number" id="price" th:field="*{price}" class="form-control" placeholder="VD: 129000" min="0" required/>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="quantity">Số lượng món ăn</label>
                                <input type="number" id="quantity" th:field="*{quantity}" class="form-control" placeholder="VD: 50" min="0" required/>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="imageUrl">URL Hình ảnh</label>
                                <input type="text" id="imageUrl" th:field="*{imageUrl}" class="form-control" placeholder="/images/dishes/bo-my.jpg"/>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="description">Mô tả món ăn</label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="2" placeholder="Mô tả hương vị, nguyên liệu..."></textarea>
                            </div>

                            <div style="display:flex; flex-direction:column; gap:8px;">
                                <button type="submit" id="btnSaveDish" class="btn btn-primary btn-block">
                                    <i class="bi bi-save-fill"></i> Lưu Món Ăn
                                </button>
                                <button type="button" id="btnUpdateDish" class="btn btn-gold btn-block" style="display:none;" onclick="submitUpdate()">
                                    <i class="bi bi-check-circle-fill"></i> Cập Nhật
                                </button>
                                <button type="button" id="btnResetDish" class="btn btn-secondary btn-block" style="display:none;" onclick="resetForm()">
                                    <i class="bi bi-arrow-counterclockwise"></i> Hủy chỉnh sửa
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Bảng Thực Đơn -->
                <div class="card" style="grid-column: span 2;">
                    <div class="card-header">
                        <h2 class="card-title"><i class="bi bi-egg-fried" style="color:var(--clr-coral);"></i> Danh sách Món ăn</h2>
                        <div>
                            <form th:action="@{/admin/dishes}" method="get" style="display:flex; gap:8px;">
                                <select name="categoryId" class="form-control" onchange="this.form.submit()" style="padding:6px 12px; font-size:0.85rem;">
                                    <option value="">Tất cả danh mục</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == selectedCategoryId}"></option>
                                </select>
                            </form>
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Món ăn</th>
                                    <th>Danh mục</th>
                                    <th>Giá</th>
                                    <th>Số lượng</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="dish : ${dishes}">
                                    <td>
                                        <div style="display:flex; align-items:center; gap:12px;">
                                            <div style="width:40px; height:40px; border-radius:var(--radius-md); background:var(--clr-surface-3); overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                                                <img th:if="${dish.imageUrl}" th:src="${dish.imageUrl}" alt="img" style="width:100%; height:100%; object-fit:cover;"/>
                                                <span th:unless="${dish.imageUrl}" style="font-size:1.2rem;">🍲</span>
                                            </div>
                                            <div>
                                                <div th:text="${dish.name}" style="font-weight:600; color:var(--clr-text-primary);"></div>
                                                <div th:text="${dish.description ?: '—'}" style="font-size:0.75rem; color:var(--clr-text-muted);"></div>
                                            </div>
                                        </div>
                                    </td>
                                    <td th:text="${dish.category.name}"></td>
                                    <td th:text="${#numbers.formatDecimal(dish.price, 0, 'COMMA', 0, 'POINT')} + ' đ'" style="font-weight:700; color:var(--clr-gold);"></td>
                                    <td th:text="${dish.quantity} + ' suất'" style="font-weight:600;"></td>
                                    <td>
                                        <span th:if="${dish.status.name() == 'AVAILABLE' && dish.quantity >= 1}" class="badge badge-available">Đang phục vụ</span>
                                        <span th:if="${dish.status.name() == 'OUT_OF_STOCK' || dish.quantity < 1}" class="badge badge-out-of-stock">Tạm hết hàng</span>
                                    </td>
                                    <td>
                                        <div style="display:flex; gap:6px;">
                                            <button type="button" class="btn btn-warning btn-sm edit-dish-btn" title="Sửa món ăn"
                                                th:data-id="${dish.id}"
                                                th:data-category-id="${dish.category.id}"
                                                th:data-name="${dish.name}"
                                                th:data-price="${dish.price}"
                                                th:data-quantity="${dish.quantity}"
                                                th:data-image-url="${dish.imageUrl}"
                                                th:data-status="${dish.status.name()}"
                                                th:data-description="${dish.description}">
                                                <i class="bi bi-pencil-square"></i> Sửa
                                            </button>
                                            <form th:action="@{/admin/dishes/{id}/delete(id=${dish.id})}" method="post" style="display:inline;">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <button type="submit" class="btn btn-danger btn-sm" data-confirm="Bạn có chắc muốn xóa món này?">
                                                    <i class="bi bi-trash-fill"></i> Xóa
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${dishes.isEmpty()}">
                                    <td colspan="6" style="text-align:center; padding:32px; color:var(--clr-text-muted);">Không có món ăn nào trong danh mục này.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const dishForm = document.getElementById('dishForm');
        const dishIdInput = document.getElementById('dishId');
        const categoryIdInput = document.getElementById('categoryId');
        const nameInput = document.getElementById('name');
        const priceInput = document.getElementById('price');
        const quantityInput = document.getElementById('quantity');
        const imageUrlInput = document.getElementById('imageUrl');
        const descriptionInput = document.getElementById('description');

        const btnSave = document.getElementById('btnSaveDish');
        const btnUpdate = document.getElementById('btnUpdateDish');
        const btnReset = document.getElementById('btnResetDish');
        const formCardTitle = document.getElementById('formCardTitle');

        document.querySelectorAll('.edit-dish-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                const id = this.getAttribute('data-id');
                const categoryId = this.getAttribute('data-category-id');
                const name = this.getAttribute('data-name');
                const price = this.getAttribute('data-price');
                const quantity = this.getAttribute('data-quantity');
                const imageUrl = this.getAttribute('data-image-url') || '';
                const description = this.getAttribute('data-description') || '';

                if (dishIdInput) dishIdInput.value = id;
                if (categoryIdInput) categoryIdInput.value = categoryId;
                if (nameInput) nameInput.value = name;
                if (priceInput) priceInput.value = price;
                if (quantityInput) quantityInput.value = quantity;
                if (imageUrlInput) imageUrlInput.value = imageUrl;
                if (descriptionInput) descriptionInput.value = description;

                dishForm.action = '/admin/dishes/' + id + '/update';
                if (formCardTitle) {
                    formCardTitle.innerHTML = '<i class="bi bi-pencil-square" style="color:var(--clr-gold);"></i> Chỉnh Sửa Món Ăn';
                }
                if (btnSave) btnSave.style.display = 'none';
                if (btnUpdate) btnUpdate.style.display = 'block';
                if (btnReset) btnReset.style.display = 'block';

                dishForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        });

        window.submitUpdate = function () {
            if (dishForm) dishForm.submit();
        };

        window.resetForm = function () {
            if (dishIdInput) dishIdInput.value = '';
            dishForm.reset();
            dishForm.action = '/admin/dishes';
            if (formCardTitle) {
                formCardTitle.innerHTML = '<i class="bi bi-plus-circle-fill" style="color:var(--clr-gold);"></i> Thêm Món Ăn';
            }
            if (btnSave) btnSave.style.display = 'block';
            if (btnUpdate) btnUpdate.style.display = 'none';
            if (btnReset) btnReset.style.display = 'none';
        };
    });
</script>
</body>
</html>
