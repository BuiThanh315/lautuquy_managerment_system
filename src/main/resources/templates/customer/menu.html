<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực Đơn — Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=2)}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body class="customer-page" th:style="'background: url(' + @{/images/auth-bg.jpg} + ') no-repeat center center / cover fixed;'">

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="app-shell">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img th:src="@{/images/logo.png}" alt="Lẩu Tứ Quý Logo" class="brand-logo-img"/>
                <div class="brand-name">Lẩu Tứ Quý</div>
                <div class="brand-subtitle">Restaurant Management</div>
            </div>
            <div class="sidebar-nav">
                <div class="nav-section-title">Khách hàng</div>
                <a th:href="@{/customer/menu}" class="nav-item active">
                    <i class="bi bi-journal-text nav-icon"></i><span>Thực đơn</span>
                </a>
                <a th:if="${isSeated}" th:href="@{/customer/order}" class="nav-item">
                    <i class="bi bi-cart-fill nav-icon"></i><span>Gọi món</span>
                </a>
                <a th:href="${isSeated ? 'javascript:void(0)' : '/customer/booking'}" class="nav-item"
                    th:classappend="${isSeated ? 'disabled' : ''}"
                    th:style="${isSeated ? 'pointer-events:none; opacity:0.45; cursor:not-allowed;' : ''}">
                    <i class="bi bi-calendar-plus-fill nav-icon"></i><span>Đặt bàn</span>
                </a>
                <a th:href="@{/customer/booking/history}" class="nav-item">
                    <i class="bi bi-clock-history nav-icon"></i><span>Lịch sử đặt bàn</span>
                </a>
                <a th:href="@{/customer/feedback}" class="nav-item">
                    <i class="bi bi-star-fill nav-icon"></i><span>Phản hồi</span>
                </a>

                <!-- Button Thanh toán cho Khách hàng SEATED -->
                <div th:if="${isSeated}" style="padding:16px 12px 0 12px;">
                    <a th:href="@{/customer/payment}" class="btn btn-success btn-block" style="background:#10b981; border:none; padding:10px; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px;">
                        <i class="bi bi-cash-coin"></i> Thanh toán
                    </a>
                </div>
            </div>
            <div class="sidebar-footer">
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                    <div class="user-avatar">
                        <span sec:authentication="name"
                            th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">C</span>
                    </div>
                    <div>
                        <div style="font-size:0.85rem; font-weight:600; color:var(--clr-text-primary);"
                            th:text="${#authentication.name}">Customer</div>
                        <div style="font-size:0.7rem; color:var(--clr-coral);">CUSTOMER</div>
                    </div>
                </div>
                <form th:action="@{/auth/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-secondary btn-sm btn-block" style="justify-content:center;">
                        <i class="bi bi-box-arrow-left"></i> Đăng xuất
                    </button>
                </form>
            </div>
        </nav>

        <div class="main-content">
            <header class="topbar">
                <div style="display:flex; align-items:center; gap:16px;">
                    <button id="sidebar-toggle" class="btn btn-secondary btn-sm"
                        style="display:none; padding:8px 10px;">
                        <i class="bi bi-list" style="font-size:1.2rem;"></i>
                    </button>
                    <div class="topbar-title">Thực Đơn Lẩu Tứ Quý</div>
                </div>
                <div class="topbar-user" style="display:flex; gap:10px;">
                    <a th:if="${isSeated}" th:href="@{/customer/order}" class="btn btn-gold btn-sm">
                        <i class="bi bi-cart-fill"></i> Xem đơn gọi món
                    </a>
                    <a th:unless="${isSeated}" th:href="@{/customer/booking}" class="btn btn-gold btn-sm">
                        <i class="bi bi-calendar-plus-fill"></i> Đặt bàn trước
                    </a>
                </div>
            </header>

            <main class="page-content">
                <div th:if="${successMessage}" class="alert alert-success" data-auto-dismiss="true">
                    <i class="bi bi-check-circle-fill"></i><span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger" data-auto-dismiss="true">
                    <i class="bi bi-exclamation-circle-fill"></i><span th:text="${errorMessage}"></span>
                </div>

                <!-- Filter Danh mục dạng Pills -->
                <div class="category-pills mb-lg">
                    <a th:href="@{/customer/menu}" class="category-pill"
                        th:classappend="${selectedCategoryId == null ? 'active' : ''}">
                        Tất cả món
                    </a>
                    <a th:each="cat : ${categories}" th:href="@{/customer/menu(categoryId=${cat.id})}"
                        class="category-pill" th:classappend="${selectedCategoryId == cat.id ? 'active' : ''}"
                        th:text="${cat.name}">
                    </a>
                </div>

                <!-- Danh sách Món ăn Cards -->
                <div class="grid-4 mb-xl">
                    <div th:each="dish : ${dishPage.content}" class="dish-card"
                        th:classappend="${dish.status.name() == 'OUT_OF_STOCK' || dish.quantity < 1 ? 'out-of-stock' : ''}">
                        <div class="dish-card-image">
                            <img th:src="${dish.imageUrl}" th:alt="${dish.name}"
                                onerror="this.src='https://placehold.co/400x300/760031/FEEC41?text=L%E1%BA%A3u+T%E1%BB%B9+Qu%C3%BD'" />
                            <span th:if="${dish.status.name() == 'OUT_OF_STOCK' || dish.quantity < 1}" class="badge-out-of-stock">Tạm hết</span>
                        </div>
                        <div class="dish-card-body">
                            <div class="dish-card-category" th:text="${dish.category.name}"></div>
                            <h3 class="dish-card-title" th:text="${dish.name}"></h3>
                            <p class="dish-card-desc" th:text="${dish.description ?: 'Món ăn đặc sắc của nhà hàng'}">
                            </p>
                            <div class="dish-card-footer">
                                <div class="dish-card-price"
                                    th:text="${#numbers.formatDecimal(dish.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                </div>
                                <form th:if="${isSeated}" th:action="@{/customer/order/add-ajax}" method="post" style="display:inline;" onsubmit="addDishAjax(event, this)">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <input type="hidden" name="dishId" th:value="${dish.id}" />
                                    <input type="hidden" name="quantity" value="1" />
                                    <button type="submit" class="btn btn-sm"
                                        th:classappend="${dish.status.name() == 'OUT_OF_STOCK' || dish.quantity < 1 ? 'btn-secondary disabled' : 'btn-success'}"
                                        th:disabled="${dish.status.name() == 'OUT_OF_STOCK' || dish.quantity < 1}">
                                        <i class="bi bi-plus-circle-fill"></i> Thêm món ăn
                                    </button>
                                </form>
                                <a th:unless="${isSeated}" th:href="@{/customer/booking}" class="btn btn-sm"
                                    th:classappend="${dish.status.name() == 'OUT_OF_STOCK' || dish.quantity < 1 ? 'btn-secondary disabled' : 'btn-primary'}"
                                    th:attr="aria-disabled=${dish.status.name() == 'OUT_OF_STOCK' || dish.quantity < 1}">
                                    <i class="bi bi-calendar-plus"></i> Đặt trước
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Phân trang -->
                <div th:if="${dishPage.totalPages > 1}" class="pagination">
                    <a th:href="@{/customer/menu(page=${dishPage.number - 1}, categoryId=${selectedCategoryId})}"
                        class="page-link" th:classappend="${dishPage.first ? 'disabled' : ''}">
                        &laquo; Trước
                    </a>
                    <th:block th:each="i : ${#numbers.sequence(0, dishPage.totalPages - 1)}">
                        <a th:href="@{/customer/menu(page=${i}, categoryId=${selectedCategoryId})}" class="page-link"
                            th:classappend="${i == dishPage.number ? 'active' : ''}" th:text="${i + 1}">
                        </a>
                    </th:block>
                    <a th:href="@{/customer/menu(page=${dishPage.number + 1}, categoryId=${selectedCategoryId})}"
                        class="page-link" th:classappend="${dishPage.last ? 'disabled' : ''}">
                        Sau &raquo;
                    </a>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" style="position:fixed; top:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px; pointer-events:none;"></div>

    <script th:src="@{/js/main.js}"></script>
    <script>
        async function addDishAjax(e, form) {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            if (!btn || btn.disabled) return;

            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Đang thêm...';

            try {
                const formData = new FormData(form);
                const resp = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                const data = await resp.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    if (data.remainingQty <= 0) {
                        const card = form.closest('.dish-card');
                        if (card) card.classList.add('out-of-stock');
                        btn.classList.remove('btn-success');
                        btn.classList.add('btn-secondary', 'disabled');
                        btn.disabled = true;
                        btn.innerHTML = '<i class="bi bi-x-circle"></i> Tạm hết';
                    }
                } else {
                    showToast(data.message || 'Không thể thêm món', 'error');
                }
            } catch (err) {
                showToast('Có lỗi kết nối xảy ra. Vui lòng thử lại!', 'error');
            } finally {
                if (!btn.classList.contains('disabled')) {
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                }
            }
        }
    </script>
</body>

</html>
