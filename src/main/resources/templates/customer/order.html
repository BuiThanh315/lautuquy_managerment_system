
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đơn Gọi Món Tại Bàn — Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="app-shell">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img th:src="@{/images/logo.png}" alt="Lẩu Tứ Quý Logo" class="brand-logo-img"/>
                <div class="brand-name">Lẩu Tứ Quý</div>
                <div class="brand-subtitle">Restaurant Management</div>
            </div>
            <div class="sidebar-nav">
                <div class="nav-section-title">Khách hàng</div>
                <a th:href="@{/customer/menu}" class="nav-item">
                    <i class="bi bi-journal-text nav-icon"></i><span>Thực đơn</span>
                </a>
                <a th:href="@{/customer/order}" class="nav-item active">
                    <i class="bi bi-cart-fill nav-icon"></i><span>Gọi món</span>
                </a>
                <a th:href="@{/customer/booking}" class="nav-item">
                    <i class="bi bi-calendar-plus-fill nav-icon"></i><span>Đặt bàn</span>
                </a>
                <a th:href="@{/customer/booking/history}" class="nav-item">
                    <i class="bi bi-clock-history nav-icon"></i><span>Lịch sử đặt bàn</span>
                </a>
                <a th:href="@{/customer/feedback}" class="nav-item">
                    <i class="bi bi-star-fill nav-icon"></i><span>Phản hồi</span>
                </a>

                <!-- Button Thanh toán (Tông màu green) cho phát triển tương lai -->
                <div style="padding:16px 12px 0 12px;">
                    <button type="button" class="btn btn-success btn-block" style="background:#10b981; border:none; padding:10px; font-weight:600; cursor:pointer;" onclick="alert('Chức năng Thanh Toán đang được phát triển!')">
                        <i class="bi bi-cash-coin"></i> Thanh toán
                    </button>
                </div>
            </div>
            <div class="sidebar-footer">
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                    <div class="user-avatar">
                        <span sec:authentication="name"
                            th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">C</span>
                    </div>
                    <div>
                        <div style="font-size:0.85rem; font-weight:600; color:var(--clr-text-primary);"
                            th:text="${#authentication.name}">Customer</div>
                        <div style="font-size:0.7rem; color:var(--clr-coral);">CUSTOMER</div>
                    </div>
                </div>
                <form th:action="@{/auth/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-secondary btn-sm btn-block" style="justify-content:center;">
                        <i class="bi bi-box-arrow-left"></i> Đăng xuất
                    </button>
                </form>
            </div>
        </nav>

        <div class="main-content">
            <header class="topbar">
                <div style="display:flex; align-items:center; gap:16px;">
                    <button id="sidebar-toggle" class="btn btn-secondary btn-sm"
                        style="display:none; padding:8px 10px;">
                        <i class="bi bi-list" style="font-size:1.2rem;"></i>
                    </button>
                    <div class="topbar-title" th:text="'Đơn Gọi Món — ' + (${activeBooking.assignedTable != null} ? 'Bàn ' + ${activeBooking.assignedTable.tableNumber} : 'Bàn ăn')"></div>
                </div>
            </header>

            <main class="page-content">
                <div class="card mb-xl">
                    <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
                        <h2 class="card-title">
                            <i class="bi bi-receipt" style="color:var(--clr-gold);"></i>
                            Danh sách món ăn đang phục vụ tại bàn
                        </h2>
                        <span class="badge badge-seated" style="font-size:0.85rem;"
                              th:text="${activeBooking.assignedTable != null ? 'Bàn ' + activeBooking.assignedTable.tableNumber : 'Đã nhận bàn'}"></span>
                    </div>
                    <div class="table-wrapper">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Món ăn</th>
                                    <th>Đơn giá</th>
                                    <th style="text-align:center;">Số lượng</th>
                                    <th style="text-align:right;">Thành tiền</th>
                                    <th style="text-align:center;">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${orderItems}" th:id="'order-item-row-' + ${item.id}">
                                    <td>
                                        <div style="display:flex; align-items:center; gap:12px;">
                                            <div style="width:40px; height:40px; border-radius:var(--radius-md); background:var(--clr-surface-3); overflow:hidden; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                                                <img th:if="${item.dish.imageUrl}" th:src="${item.dish.imageUrl}" alt="img" style="width:100%; height:100%; object-fit:cover;"/>
                                                <span th:unless="${item.dish.imageUrl}" style="font-size:1.2rem;">🍲</span>
                                            </div>
                                            <div>
                                                <div th:text="${item.dish.name}" style="font-weight:600; color:var(--clr-text-primary);"></div>
                                                <div th:text="${item.dish.description ?: '—'}" style="font-size:0.75rem; color:var(--clr-text-muted);"></div>
                                            </div>
                                        </div>
                                    </td>
                                    <td th:text="${#numbers.formatDecimal(item.actualPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'" style="color:var(--clr-gold); font-weight:600;"></td>
                                    <td style="text-align:center;">
                                        <form th:action="@{/customer/order/update-item-ajax}" method="post" style="display:inline-flex; align-items:center; gap:6px;" onsubmit="return false;">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <input type="hidden" name="orderItemId" th:value="${item.id}" />
                                            <input type="number" name="quantity" class="form-control qty-input"
                                                   style="width:65px; text-align:center; padding:4px;"
                                                   th:value="${item.quantity}"
                                                   min="1"
                                                   th:max="${item.quantity + item.dish.quantity}"
                                                   th:data-dish-name="${item.dish.name}"
                                                   th:data-max-qty="${item.quantity + item.dish.quantity}"
                                                   onchange="updateQtyAjax(this)"
                                                   oninput="validateAndLimitQty(this)"/>
                                        </form>
                                    </td>
                                    <td class="subtotal-cell" style="text-align:right; font-weight:700; color:var(--clr-text-primary);"
                                        th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                    <td style="text-align:center;">
                                        <form th:action="@{/customer/order/delete-item-ajax}" method="post" style="display:inline;" onsubmit="return false;">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                            <input type="hidden" name="orderItemId" th:value="${item.id}" />
                                            <button type="button" class="btn btn-danger btn-sm" onclick="deleteOrderItemAjax(event, this)">
                                                <i class="bi bi-trash"></i> Xóa
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${orderItems.isEmpty()}" class="empty-row">
                                    <td colspan="5" style="text-align:center; padding:40px; color:var(--clr-text-muted);">
                                        <i class="bi bi-cart-x" style="font-size:2.5rem; display:block; margin-bottom:10px;"></i>
                                        Bàn ăn của bạn chưa có món nào. Vui lòng quay lại <strong>"Thực đơn"</strong> để chọn món ăn!
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div style="padding:20px 24px; border-top:1px solid var(--clr-border); display:flex; justify-content:space-between; align-items:center;">
                        <button type="button" class="btn btn-primary" onclick="confirmOrderSuccess()">
                            <i class="bi bi-check-circle-fill"></i> Xác nhận
                        </button>
                        <div style="text-align:right;">
                            <span style="font-size:0.9rem; color:var(--clr-text-muted);">Tổng tiền tạm tính:</span>
                            <div id="total-amount-display" style="font-size:1.6rem; font-weight:800; color:var(--clr-gold);"
                                 th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" style="position:fixed; top:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px; pointer-events:none;"></div>

    <script th:src="@{/js/main.js}"></script>
    <script>
        function confirmOrderSuccess() {
            const activeRows = document.querySelectorAll('tbody tr:not(.empty-row)');
            if (!activeRows || activeRows.length === 0) {
                showToast('Bàn ăn của bạn chưa có món nào. Vui lòng chọn món trước khi xác nhận!', 'error');
            } else {
                showToast('Gọi đồ ăn thành công!', 'success');
            }
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN').format(amount) + ' đ';
        }

        function recalculateTotalFromDOM() {
            let total = 0;
            document.querySelectorAll('tbody tr:not(.empty-row)').forEach(tr => {
                const subtotalCell = tr.querySelector('.subtotal-cell');
                if (subtotalCell) {
                    const raw = subtotalCell.innerText.replace(/[^\d]/g, '');
                    if (raw) {
                        total += parseInt(raw, 10);
                    }
                }
            });
            const totalDisp = document.getElementById('total-amount-display');
            if (totalDisp) {
                totalDisp.innerText = formatCurrency(total);
            }
            return total;
        }

        function validateAndLimitQty(input) {
            const maxQty = parseInt(input.dataset.maxQty) || 999;
            const dishName = input.dataset.dishName || 'món ăn';
            let val = parseInt(input.value);

            if (isNaN(val)) return;

            if (val > maxQty) {
                input.value = maxQty;
                showToast(`Vượt quá số lượng hiện có! Món '${dishName}' chỉ còn lại ${maxQty} suất.`, 'error');
                updateQtyAjax(input);
            }
        }

        async function updateQtyAjax(input) {
            const form = input.closest('form');
            if (!form) return;

            const maxQty = parseInt(input.dataset.maxQty) || 999;
            const dishName = input.dataset.dishName || 'món ăn';
            let val = parseInt(input.value);

            if (isNaN(val) || val < 1) {
                input.value = 1;
                val = 1;
            }

            if (val > maxQty) {
                input.value = maxQty;
                showToast(`Vượt quá số lượng hiện có! Món '${dishName}' chỉ còn lại ${maxQty} suất.`, 'error');
                val = maxQty;
            }

            const formData = new FormData(form);
            formData.set('quantity', val);

            try {
                const resp = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                const data = await resp.json();

                if (data.success) {
                    const tr = input.closest('tr');
                    if (tr) {
                        const subtotalCell = tr.querySelector('.subtotal-cell');
                        if (subtotalCell) subtotalCell.innerText = formatCurrency(data.subtotal);
                    }
                    recalculateTotalFromDOM();
                } else if (data.exceeded) {
                    input.value = data.maxAllowed;
                    const tr = input.closest('tr');
                    if (tr) {
                        const subtotalCell = tr.querySelector('.subtotal-cell');
                        if (subtotalCell) subtotalCell.innerText = formatCurrency(data.subtotal);
                    }
                    recalculateTotalFromDOM();
                    showToast(data.message, 'error');
                } else {
                    showToast(data.message || 'Không thể cập nhật số lượng', 'error');
                }
            } catch (err) {
                showToast('Có lỗi xảy ra khi cập nhật số lượng!', 'error');
            }
        }

        async function deleteOrderItemAjax(e, btn) {
            if (e) e.preventDefault();
            if (!confirm('Bạn có chắc chắn muốn xóa món này khỏi danh sách gọi món?')) return;

            const form = btn.closest('form');
            if (!form) return;

            btn.disabled = true;

            try {
                const formData = new FormData(form);
                const resp = await fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                const data = await resp.json();
                if (data.success) {
                    const tr = form.closest('tr');
                    if (tr) {
                        tr.style.transition = 'all 0.3s ease';
                        tr.style.opacity = '0';
                        tr.style.transform = 'translateX(20px)';
                        setTimeout(() => {
                            tr.remove();
                            recalculateTotalFromDOM();
                            const tbody = document.querySelector('tbody');
                            const remainingRows = tbody ? tbody.querySelectorAll('tr:not(.empty-row)') : [];
                            if (remainingRows.length === 0 && tbody) {
                                const emptyRow = document.createElement('tr');
                                emptyRow.className = 'empty-row';
                                emptyRow.innerHTML = '<td colspan="5" style="text-align:center; padding:40px; color:var(--clr-text-muted);"><i class="bi bi-cart-x" style="font-size:2.5rem; display:block; margin-bottom:10px;"></i> Bàn ăn của bạn chưa có món nào. Vui lòng quay lại <strong>"Thực đơn"</strong> để chọn món ăn!</td>';
                                tbody.appendChild(emptyRow);
                            }
                        }, 300);
                    }
                    showToast(data.message, 'success');
                } else {
                    showToast(data.message || 'Không thể xóa món ăn', 'error');
                    btn.disabled = false;
                }
            } catch (err) {
                showToast('Có lỗi xảy ra khi xóa món ăn!', 'error');
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
