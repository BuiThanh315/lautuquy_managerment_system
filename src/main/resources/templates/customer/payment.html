<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">Thanh Toán Đơn Bàn — Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=2)}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body class="customer-page" th:style="'background: url(' + @{/images/auth-bg.jpg} + ') no-repeat center center / cover fixed;'">

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="app-shell">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img th:src="@{/images/logo.png}" alt="Lẩu Tứ Quý Logo" class="brand-logo-img"/>
                <div class="brand-name">Lẩu Tứ Quý</div>
                <div class="brand-subtitle">Restaurant Management</div>
            </div>
            <div class="sidebar-nav">
                <div class="nav-section-title">Khách hàng</div>
                <a th:href="@{/customer/menu}" class="nav-item">
                    <i class="bi bi-journal-text nav-icon"></i><span>Thực đơn</span>
                </a>
                <a th:href="@{/customer/order}" class="nav-item">
                    <i class="bi bi-cart-fill nav-icon"></i><span>Gọi món</span>
                </a>
                <a th:href="@{/customer/booking}" class="nav-item">
                    <i class="bi bi-calendar-plus-fill nav-icon"></i><span>Đặt bàn</span>
                </a>
                <a th:href="@{/customer/booking/history}" class="nav-item">
                    <i class="bi bi-clock-history nav-icon"></i><span>Lịch sử đặt bàn</span>
                </a>
                <a th:href="@{/customer/feedback}" class="nav-item">
                    <i class="bi bi-star-fill nav-icon"></i><span>Phản hồi</span>
                </a>

                <!-- Button Thanh toán -->
                <div style="padding:16px 12px 0 12px;">
                    <a th:href="@{/customer/payment}" class="btn btn-success btn-block" style="background:#10b981; border:none; padding:10px; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px;">
                        <i class="bi bi-cash-coin"></i> Thanh toán
                    </a>
                </div>
            </div>
            <div class="sidebar-footer">
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                    <div class="user-avatar">
                        <span sec:authentication="name"
                            th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">C</span>
                    </div>
                    <div>
                        <div style="font-size:0.85rem; font-weight:600; color:var(--clr-text-primary);"
                            th:text="${#authentication.name}">Customer</div>
                        <div style="font-size:0.7rem; color:var(--clr-coral);">CUSTOMER</div>
                    </div>
                </div>
                <form th:action="@{/auth/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-secondary btn-sm btn-block" style="justify-content:center;">
                        <i class="bi bi-box-arrow-left"></i> Đăng xuất
                    </button>
                </form>
            </div>
        </nav>

        <div class="main-content">
            <header class="topbar">
                <div style="display:flex; align-items:center; gap:16px;">
                    <button id="sidebar-toggle" class="btn btn-secondary btn-sm" style="display:none; padding:8px 10px;">
                        <i class="bi bi-list" style="font-size:1.2rem;"></i>
                    </button>
                    <div class="topbar-title" th:text="'Thanh Toán Hóa Đơn — ' + (${seatedBooking.assignedTable != null} ? 'Bàn ' + ${seatedBooking.assignedTable.tableNumber} : 'Bàn ăn')"></div>
                </div>
            </header>

            <main class="page-content">

                <div th:if="${successMessage}" class="alert alert-success" data-auto-dismiss="true">
                    <i class="bi bi-check-circle-fill"></i> <span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger" data-auto-dismiss="true">
                    <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${errorMessage}"></span>
                </div>

                <div style="display:grid; grid-template-columns: 2fr 1fr; gap:24px;">
                    <!-- Danh sách món đã gọi -->
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title">
                                <i class="bi bi-receipt-cutoff" style="color:var(--clr-gold);"></i>
                                Chi tiết đơn phục vụ tại bàn
                            </h2>
                        </div>
                        <div class="table-wrapper">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Món ăn</th>
                                        <th>Đơn giá</th>
                                        <th style="text-align:center;">Số lượng</th>
                                        <th style="text-align:right;">Thành tiền</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${orderItems}">
                                        <td th:text="${item.dish.name}" style="font-weight:600;"></td>
                                        <td th:text="${#numbers.formatDecimal(item.actualPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                        <td style="text-align:center;" th:text="${item.quantity}"></td>
                                        <td style="text-align:right; font-weight:700;" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                    </tr>
                                    <tr th:if="${orderItems.isEmpty()}">
                                        <td colspan="4" style="text-align:center; padding:30px; color:var(--clr-text-muted);">Chưa có món ăn nào trong đơn.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Card chọn phương thức thanh toán -->
                    <div class="card">
                        <div class="card-header">
                            <h2 class="card-title"><i class="bi bi-wallet2" style="color:#10b981;"></i> Thanh toán</h2>
                        </div>
                        <div style="padding:20px;">
                            <div style="margin-bottom:20px; text-align:center; background:var(--clr-surface-2); padding:16px; border-radius:var(--radius-md);">
                                <div style="font-size:0.9rem; color:var(--clr-text-muted);">Tổng số tiền cần thanh toán:</div>
                                <div style="font-size:1.8rem; font-weight:800; color:var(--clr-gold); margin-top:4px;"
                                     th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                            </div>

                            <form th:action="@{/customer/payment/submit}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <div class="form-group mb-md">
                                    <label class="form-label" style="font-weight:600;">Chọn phương thức thanh toán:</label>
                                    <div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">
                                        <label style="display:flex; align-items:center; gap:10px; cursor:pointer; padding:12px; border:1px solid var(--clr-border); border-radius:var(--radius-md);">
                                            <input type="radio" name="paymentMethod" value="CASH" checked />
                                            <i class="bi bi-cash-stack" style="font-size:1.4rem; color:#10b981;"></i>
                                            <div>
                                                <div style="font-weight:600;">Tiền mặt</div>
                                                <div style="font-size:0.75rem; color:var(--clr-text-muted);">Thanh toán trực tiếp cho nhân viên tại bàn</div>
                                            </div>
                                        </label>

                                        <label style="display:flex; align-items:center; gap:10px; cursor:pointer; padding:12px; border:1px solid var(--clr-border); border-radius:var(--radius-md);">
                                            <input type="radio" name="paymentMethod" value="BANK_TRANSFER" />
                                            <i class="bi bi-qr-code-scan" style="font-size:1.4rem; color:var(--clr-gold);"></i>
                                            <div>
                                                <div style="font-weight:600;">Chuyển khoản Banking</div>
                                                <div style="font-size:0.75rem; color:var(--clr-text-muted);">Quét mã QR chuyển khoản cho nhà hàng</div>
                                            </div>
                                        </label>
                                    </div>
                                </div>



                                <button type="submit" class="btn btn-success btn-block" style="background:#10b981; border:none; padding:12px; font-weight:700; font-size:1rem;">
                                    <i class="bi bi-check-circle-fill"></i> Xác nhận thanh toán
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>

</html>
