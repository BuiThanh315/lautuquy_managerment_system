<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>404 — Không tìm thấy | Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        .error-page {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background:
                radial-gradient(ellipse at top right, rgba(254,236,65,0.08) 0%, transparent 50%),
                var(--clr-bg);
            text-align: center; padding: 24px;
        }
        .error-content { max-width: 480px; }
        .error-code {
            font-size: 8rem; font-weight: 900; line-height: 1;
            background: linear-gradient(135deg, var(--clr-gold), var(--clr-coral));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .error-icon {
            font-size: 4rem; margin: 16px 0;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }
    </style>
</head>
<body class="error-page">
    <div class="error-content">
        <div class="error-code">404</div>
        <div class="error-icon">🍜</div>
        <h1 style="font-size:1.5rem; font-weight:700; color:var(--clr-text-primary); margin-bottom:12px;">
            Trang không tồn tại
        </h1>
        <p style="color:var(--clr-text-muted); margin-bottom:32px; line-height:1.7;"
           th:text="${message ?: 'Trang hoặc tài nguyên bạn tìm kiếm không tồn tại hoặc đã bị xóa.'}">
        </p>
        <p th:if="${requestUrl}" style="font-size:0.8rem; color:var(--clr-text-muted); margin-bottom:24px;">
            URL: <code style="color:var(--clr-coral);" th:text="${requestUrl}"></code>
        </p>
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <a th:href="@{/}" class="btn btn-primary">
                <i class="bi bi-house-fill"></i> Trang chủ
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Quay lại
            </a>
        </div>
    </div>
</body>
</html>
