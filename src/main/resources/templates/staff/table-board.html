<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sơ Đồ Bàn Ăn — Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="app-shell">
        <!-- SIDEBAR STAFF -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img th:src="@{/images/logo.png}" alt="Lẩu Tứ Quý Logo" class="brand-logo-img" />
                <div class="brand-name">Lẩu Tứ Quý</div>
                <div class="brand-subtitle">Restaurant Management</div>
            </div>
            <div class="sidebar-nav">
                <div class="nav-section-title">Nhân viên</div>
                <a th:href="@{/staff/bookings}" class="nav-item">
                    <i class="bi bi-calendar-check-fill nav-icon"></i><span>Duyệt đặt bàn</span>
                </a>
                <a th:href="@{/staff/table-board}" class="nav-item active">
                    <i class="bi bi-grid-3x3-gap-fill nav-icon"></i><span>Sơ đồ bàn ăn</span>
                </a>
                <a th:href="@{/staff/invoices}" class="nav-item">
                    <i class="bi bi-receipt nav-icon"></i><span>Hóa đơn</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                    <div class="user-avatar">
                        <span sec:authentication="name"
                            th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">S</span>
                    </div>
                    <div>
                        <div style="font-size:0.85rem; font-weight:600; color:var(--clr-text-primary);"
                            th:text="${#authentication.name}">Staff</div>
                        <div style="font-size:0.7rem; color:var(--clr-coral);" sec:authentication="principal.authorities">STAFF</div>
                    </div>
                </div>
                <form th:action="@{/auth/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-secondary btn-sm btn-block" style="justify-content:center;">
                        <i class="bi bi-box-arrow-left"></i> Đăng xuất
                    </button>
                </form>
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <header class="topbar">
                <div style="display:flex; align-items:center; gap:16px;">
                    <button id="sidebar-toggle" class="btn btn-secondary btn-sm"
                        style="display:none; padding:8px 10px;">
                        <i class="bi bi-list" style="font-size:1.2rem;"></i>
                    </button>
                    <div>
                        <div class="topbar-title">Sơ Đồ Bàn Ăn Thời Gian Thực</div>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:12px;">
                    <span id="live-indicator" style="display:inline-flex; align-items:center; gap:6px; font-size:0.75rem; color:var(--clr-success); background:rgba(46, 125, 82, 0.12); padding:4px 10px; border-radius:999px;">
                        <i class="bi bi-circle-fill" style="font-size:0.5rem; animation: pulse 1.5s infinite;"></i> AJAX Realtime (10s)
                    </span>
                </div>
            </header>

            <main class="page-content">

                <!-- Legend status pills -->
                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px;">
                    <div style="display:flex; align-items:center; gap:6px; font-size:0.85rem; background:var(--clr-surface); padding:8px 14px; border-radius:var(--radius-md); border:1px solid var(--clr-border);">
                        <span class="badge badge-active" style="padding:4px 8px;">EMPTY</span> <span>Bàn trống</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px; font-size:0.85rem; background:var(--clr-surface); padding:8px 14px; border-radius:var(--radius-md); border:1px solid var(--clr-border);">
                        <span class="badge badge-pending" style="padding:4px 8px;">RESERVED</span> <span>Đã đặt trước</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px; font-size:0.85rem; background:var(--clr-surface); padding:8px 14px; border-radius:var(--radius-md); border:1px solid var(--clr-border);">
                        <span class="badge badge-seated" style="padding:4px 8px;">SERVING</span> <span>Đang phục vụ</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px; font-size:0.85rem; background:var(--clr-surface); padding:8px 14px; border-radius:var(--radius-md); border:1px solid var(--clr-border);">
                        <span class="badge badge-locked" style="padding:4px 8px;">DIRTY</span> <span>Cần dọn dẹp</span>
                    </div>
                </div>

                <!-- Responsive Tables Grid -->
                <div id="table-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap:20px;">
                    <div th:each="t : ${tables}" class="card table-card" th:id="'table-card-' + ${t.id}"
                        style="padding:20px; transition:transform 0.2s ease, box-shadow 0.2s ease; border-top: 4px solid var(--clr-border);">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                            <div style="font-size:1.25rem; font-weight:700; color:var(--clr-text-primary);" th:text="'Bàn ' + ${t.tableNumber}"></div>
                            <span class="badge" th:classappend="${t.status.name() == 'EMPTY' ? 'badge-active' : (t.status.name() == 'RESERVED' ? 'badge-pending' : (t.status.name() == 'SERVING' ? 'badge-seated' : 'badge-locked'))}"
                                th:text="${t.status}">
                            </span>
                        </div>
                        <div style="font-size:0.85rem; color:var(--clr-text-secondary); margin-bottom:16px;">
                            <i class="bi bi-people"></i> Sức chứa: <strong th:text="${t.tableType.capacity}"></strong> người
                            <span style="display:block; font-size:0.75rem; color:var(--clr-text-muted);" th:text="'Loại: ' + ${t.tableType.tableClass}"></span>
                        </div>
                        <div style="margin-top:auto; pt:12px; border-top:1px dashed var(--clr-border);">
                            <a th:if="${t.status.name() == 'SERVING'}" th:href="@{/staff/bookings}" class="btn btn-primary btn-sm btn-block" style="justify-content:center;">
                                <i class="bi bi-eye"></i> Xem đơn hàng
                            </a>
                            <form th:if="${t.status.name() == 'DIRTY'}" th:action="@{/staff/tables/{id}/clean(id=${t.id})}" method="post" style="display:block; width:100%;">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-success btn-sm btn-block" style="justify-content:center; width:100%; background:#10b981; border:none;"
                                        data-confirm="Xác nhận bàn này đã được dọn dẹp sạch sẽ?">
                                    <i class="bi bi-stars"></i> Đã dọn dẹp
                                </button>
                            </form>
                            <span th:if="${t.status.name() != 'SERVING' && t.status.name() != 'DIRTY'}" style="font-size:0.8rem; color:var(--clr-text-muted); display:block; text-align:center;">
                                — Sẵn sàng —
                            </span>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/table-board.js}"></script>
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:99; }
        .sidebar-overlay.active { display:block; }
        @media (max-width:992px) { #sidebar-toggle { display:flex !important; } }
    </style>
</body>

</html>
