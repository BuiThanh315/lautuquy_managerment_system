<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quản lý Danh mục — Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

<div id="sidebar-overlay" class="sidebar-overlay"></div>

<div class="app-shell">
    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img th:src="@{/images/logo.png}" alt="Lẩu Tứ Quý Logo" class="brand-logo-img"/>
            <div class="brand-name">Lẩu Tứ Quý</div>
            <div class="brand-subtitle">Restaurant Management</div>
        </div>
        <div class="sidebar-nav">
            <div class="nav-section-title">Quản trị viên</div>
            <a th:href="@{/admin/accounts}" class="nav-item">
                <i class="bi bi-people-fill nav-icon"></i><span>Tài khoản</span>
            </a>
            <a th:href="@{/admin/categories}" class="nav-item active">
                <i class="bi bi-grid-3x3-gap-fill nav-icon"></i><span>Danh mục</span>
            </a>
            <a th:href="@{/admin/dishes}" class="nav-item">
                <i class="bi bi-egg-fried nav-icon"></i><span>Thực đơn</span>
            </a>
            <a th:href="@{/admin/tables}" class="nav-item">
                <i class="bi bi-table nav-icon"></i><span>Bàn ăn</span>
            </a>
            <a th:href="@{/admin/feedbacks}" class="nav-item">
                <i class="bi bi-chat-dots-fill nav-icon"></i><span>Phản hồi</span>
            </a>
            <a th:href="@{/admin/dashboard}" class="nav-item">
                <i class="bi bi-bar-chart-fill nav-icon"></i><span>Báo cáo</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                <div class="user-avatar">
                    <span sec:authentication="name" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">A</span>
                </div>
                <div>
                    <div style="font-size:0.85rem; font-weight:600; color:var(--clr-text-primary);" th:text="${#authentication.name}">Admin</div>
                    <div style="font-size:0.7rem; color:var(--clr-gold);">ADMIN</div>
                </div>
            </div>
            <form th:action="@{/auth/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-secondary btn-sm btn-block" style="justify-content:center;">
                    <i class="bi bi-box-arrow-left"></i> Đăng xuất
                </button>
            </form>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <header class="topbar">
            <div style="display:flex; align-items:center; gap:16px;">
                <button id="sidebar-toggle" class="btn btn-secondary btn-sm" style="display:none; padding:8px 10px;">
                    <i class="bi bi-list" style="font-size:1.2rem;"></i>
                </button>
                <div class="topbar-title">Quản lý Danh mục Món ăn</div>
            </div>
            <div class="topbar-user">
                <span style="font-size:0.8rem; color:var(--clr-text-muted);" th:text="'Xin chào, ' + ${#authentication.name}"></span>
            </div>
        </header>

        <main class="page-content">
            <!-- Flash Messages -->
            <div th:if="${successMessage}" class="alert alert-success" data-auto-dismiss="true">
                <i class="bi bi-check-circle-fill"></i><span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger" data-auto-dismiss="true">
                <i class="bi bi-exclamation-circle-fill"></i><span th:text="${errorMessage}"></span>
            </div>

            <div class="grid-3 mb-xl">
                <!-- Form Thêm Danh mục -->
                <div class="card" style="grid-column: span 1;">
                    <div class="card-header">
                        <h2 class="card-title"><i class="bi bi-plus-circle-fill" style="color:var(--clr-gold);"></i> Thêm Danh mục</h2>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/categories}" method="post" th:object="${categoryRequest}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="form-group">
                                <label class="form-label" for="name">Tên danh mục</label>
                                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="VD: Nước lẩu, Đồ nhúng..." required/>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="description">Mô tả</label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="3" placeholder="Mô tả danh mục..."></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block">
                                <i class="bi bi-save-fill"></i> Lưu Danh mục
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Bảng Danh sách Danh mục -->
                <div class="card" style="grid-column: span 2;">
                    <div class="card-header">
                        <h2 class="card-title"><i class="bi bi-list-ul" style="color:var(--clr-coral);"></i> Danh sách Danh mục</h2>
                    </div>
                    <div class="table-wrapper">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Tên danh mục</th>
                                    <th>Mô tả</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat, iter : ${categories}">
                                    <td th:text="${iter.index + 1}" style="color:var(--clr-text-muted);"></td>
                                    <td th:text="${cat.name}" style="font-weight:600; color:var(--clr-gold);"></td>
                                    <td th:text="${cat.description ?: '—'}"></td>
                                    <td>
                                        <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post" style="display:inline;">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-danger btn-sm" data-confirm="Bạn có chắc muốn xóa danh mục này?">
                                                <i class="bi bi-trash-fill"></i> Xóa
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${categories.isEmpty()}">
                                    <td colspan="4" style="text-align:center; padding:32px; color:var(--clr-text-muted);">Chưa có danh mục nào.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
