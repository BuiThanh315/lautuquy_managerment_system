<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Đăng nhập vào hệ thống quản lý Nhà hàng Lẩu Tứ Quý"/>
    <title>Đăng nhập — Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=2)}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body class="auth-page" th:style="'background: url(' + @{/images/auth-bg.jpg} + ') no-repeat center center / cover fixed;'">

<div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
        <img th:src="@{/images/logo.png}" alt="Lẩu Tứ Quý Logo" class="auth-logo-img"/>
        <div class="logo-name">Lẩu Tứ Quý</div>
        <div class="logo-tagline">Hệ thống Quản lý Nhà hàng</div>
    </div>

    <h1 class="auth-title">Đăng nhập</h1>

    <!-- Flash Messages -->
    <div th:if="${param.logout}" class="alert alert-success" data-auto-dismiss="true">
        <i class="bi bi-check-circle-fill"></i>
        Bạn đã đăng xuất thành công.
    </div>

    <div th:if="${successMessage}" class="alert alert-success" data-auto-dismiss="true">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <!-- Error Messages -->
    <div th:if="${param.error}" class="alert alert-danger">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>Tên đăng nhập hoặc mật khẩu không đúng. Tài khoản có thể đã bị khóa.</span>
    </div>

    <!-- Login Form -->
    <form th:action="@{/auth/login}" method="post" data-loading="true">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="form-group">
            <label class="form-label" for="username">
                <i class="bi bi-person-fill"></i> Tên đăng nhập
            </label>
            <input type="text"
                   id="username"
                   name="username"
                   class="form-control"
                   placeholder="Nhập tên đăng nhập..."
                   autocomplete="username"
                   required
                   autofocus/>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">
                <i class="bi bi-lock-fill"></i> Mật khẩu
            </label>
            <div style="position:relative;">
                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Nhập mật khẩu..."
                       autocomplete="current-password"
                       required
                       style="padding-right: 44px;"/>
                <button type="button" id="toggle-password"
                        style="position:absolute; right:12px; top:50%; transform:translateY(-50%);
                               background:none; border:none; color:var(--clr-text-muted);
                               cursor:pointer; font-size:1rem; padding:4px;"
                        aria-label="Hiện/ẩn mật khẩu">
                    <i class="bi bi-eye" id="pwd-icon"></i>
                </button>
            </div>
        </div>

        <div class="mt-lg">
            <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login">
                <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
            </button>
        </div>
    </form>

    <div class="auth-divider">hoặc</div>

    <div class="text-center">
        <span style="font-size:0.875rem; color:var(--clr-text-muted);">Chưa có tài khoản? </span>
        <a th:href="@{/auth/register}" style="font-weight:600;">Đăng ký ngay</a>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
<script>
    // Toggle hiển thị mật khẩu
    document.getElementById('toggle-password').addEventListener('click', function() {
        const pwdInput = document.getElementById('password');
        const icon = document.getElementById('pwd-icon');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            pwdInput.type = 'password';
            icon.className = 'bi bi-eye';
        }
    });
</script>
</body>
</html>
