<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Đăng ký tài khoản khách hàng tại Nhà hàng Lẩu Tứ Quý"/>
    <title>Đăng ký — Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=2)}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        .auth-card { max-width: 440px; padding: 16px 24px; }
        .strength-bar { height: 4px; border-radius: 2px; background: var(--clr-surface-3); margin-top: 4px; overflow: hidden; }
        .strength-fill { height: 100%; border-radius: 2px; transition: all 0.3s ease; width: 0; }
    </style>
</head>
<body class="auth-page" th:style="'background: url(' + @{/images/auth-bg.jpg} + ') no-repeat center center / cover fixed;'">

<div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
        <img th:src="@{/images/logo.png}" alt="Lẩu Tứ Quý Logo" class="auth-logo-img"/>
        <div class="logo-name">Lẩu Tứ Quý</div>
        <div class="logo-tagline">Tạo tài khoản mới</div>
    </div>

    <h1 class="auth-title">Đăng ký</h1>

    <!-- Server-side error -->
    <div th:if="${errorMessage}" class="alert alert-danger">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Registration Form -->
    <form th:action="@{/auth/register}" method="post"
          th:object="${registerRequest}" data-loading="true" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- Họ và tên -->
        <div class="form-group">
            <label class="form-label" for="fullName">
                <i class="bi bi-person-vcard"></i> Họ và tên
            </label>
            <input type="text" id="fullName" th:field="*{fullName}"
                   th:class="'form-control' + (${#fields.hasErrors('fullName')} ? ' is-invalid' : '')"
                   placeholder="Nguyễn Văn A"/>
            <span class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                  th:errors="*{fullName}"></span>
        </div>

        <!-- Tên đăng nhập -->
        <div class="form-group">
            <label class="form-label" for="username">
                <i class="bi bi-at"></i> Tên đăng nhập
            </label>
            <input type="text" id="username" th:field="*{username}"
                   th:class="'form-control' + (${#fields.hasErrors('username')} ? ' is-invalid' : '')"
                   placeholder="Tối thiểu 4 ký tự, không dấu"/>
            <span class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                  th:errors="*{username}"></span>
        </div>

        <!-- Mật khẩu -->
        <div class="form-group">
            <label class="form-label" for="password">
                <i class="bi bi-lock-fill"></i> Mật khẩu
            </label>
            <div style="position:relative;">
                <input type="password" id="password" th:field="*{password}"
                       th:class="'form-control' + (${#fields.hasErrors('password')} ? ' is-invalid' : '')"
                       placeholder="Tối thiểu 6 ký tự"
                       style="padding-right: 44px;"
                       oninput="checkStrength(this.value)"/>
                <button type="button" onclick="togglePwd('password', 'pwd-icon')"
                        style="position:absolute; right:12px; top:50%; transform:translateY(-50%);
                               background:none; border:none; color:var(--clr-text-muted);
                               cursor:pointer; font-size:1rem; padding:4px;">
                    <i class="bi bi-eye" id="pwd-icon"></i>
                </button>
            </div>
            <div class="strength-bar">
                <div class="strength-fill" id="strength-fill"></div>
            </div>
            <span class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}"></span>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label class="form-label" for="email">
                <i class="bi bi-envelope-fill"></i> Email <span style="color:var(--clr-text-muted); font-weight:400;">(tuỳ chọn)</span>
            </label>
            <input type="email" id="email" th:field="*{email}"
                   th:class="'form-control' + (${#fields.hasErrors('email')} ? ' is-invalid' : '')"
                   placeholder="example@email.com"/>
            <span class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"></span>
        </div>

        <!-- Số điện thoại -->
        <div class="form-group">
            <label class="form-label" for="phone">
                <i class="bi bi-telephone-fill"></i> Số điện thoại <span style="color:var(--clr-text-muted); font-weight:400;">(tuỳ chọn)</span>
            </label>
            <input type="tel" id="phone" th:field="*{phone}"
                   th:class="'form-control' + (${#fields.hasErrors('phone')} ? ' is-invalid' : '')"
                   placeholder="0912 345 678"
                   maxlength="10"
                   oninput="validatePhone(this)"/>
            <span class="invalid-feedback" th:if="${#fields.hasErrors('phone')}"
                  th:errors="*{phone}"></span>
            <div id="phone-error" style="display:none; font-size:0.78rem; color:var(--clr-coral); margin-top:4px;">
                <i class="bi bi-exclamation-circle-fill"></i> <span id="phone-error-msg"></span>
            </div>
        </div>

        <div class="mt-lg">
            <button type="submit" class="btn btn-gold btn-block btn-lg" id="btn-register">
                <i class="bi bi-person-plus-fill"></i> Tạo tài khoản
            </button>
        </div>
    </form>

    <div class="auth-divider">đã có tài khoản?</div>

    <div class="text-center">
        <a th:href="@{/auth/login}" class="btn btn-secondary" style="width:100%;">
            <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
        </a>
    </div>
</div>

<script th:src="@{/js/main.js}"></script>
<script>
    // Regex đầu số điện thoại Việt Nam hợp lệ (10 số)
    const PHONE_REGEX = /^(03[2-9]|09[6-8]|08[1-6]|088|09[14]|07[06-9]|09[03]|089|05[68]|092|059|099)\d{7}$/;

    function validatePhone(input) {
        const val = input.value.trim();
        const errorDiv = document.getElementById('phone-error');
        const errorMsg = document.getElementById('phone-error-msg');

        // Xoá lỗi nếu ô trống (vì là tuỳ chọn)
        if (val === '') {
            errorDiv.style.display = 'none';
            input.classList.remove('is-invalid');
            return;
        }

        if (!/^\d+$/.test(val)) {
            errorDiv.style.display = 'block';
            errorMsg.textContent = 'Số điện thoại chỉ được chứa chữ số.';
            input.classList.add('is-invalid');
        } else if (val.length !== 10) {
            errorDiv.style.display = 'block';
            errorMsg.textContent = 'Số điện thoại phải có đúng 10 chữ số.';
            input.classList.add('is-invalid');
        } else if (!PHONE_REGEX.test(val)) {
            errorDiv.style.display = 'block';
            errorMsg.textContent = 'Đầu số không hợp lệ. Vui lòng nhập số điện thoại Việt Nam (VD: 0912345678).';
            input.classList.add('is-invalid');
        } else {
            errorDiv.style.display = 'none';
            input.classList.remove('is-invalid');
        }
    }

    // Chặn submit nếu phone có lỗi
    document.querySelector('form[data-loading]').addEventListener('submit', function(e) {
        const phoneInput = document.getElementById('phone');
        if (phoneInput && phoneInput.value.trim() !== '') {
            validatePhone(phoneInput);
            if (phoneInput.classList.contains('is-invalid')) {
                e.preventDefault();
                phoneInput.focus();
            }
        }
    });

    function togglePwd(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon  = document.getElementById(iconId);
        input.type  = input.type === 'password' ? 'text' : 'password';
        icon.className = input.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    }

    function checkStrength(value) {
        const fill = document.getElementById('strength-fill');
        let score = 0;
        if (value.length >= 6) score++;
        if (value.length >= 10) score++;
        if (/[A-Z]/.test(value)) score++;
        if (/[0-9]/.test(value)) score++;
        if (/[^A-Za-z0-9]/.test(value)) score++;

        const colors = ['#D51C39', '#FF6060', '#FEEC41', '#a8e063', '#2ecc71'];
        const widths = ['20%', '40%', '60%', '80%', '100%'];
        fill.style.width  = score > 0 ? widths[score - 1] : '0';
        fill.style.background = score > 0 ? colors[score - 1] : 'transparent';
    }
</script>
</body>
</html>
