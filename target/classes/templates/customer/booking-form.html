<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt Bàn Trước — Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="app-shell">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img th:src="@{/images/logo.png}" alt="Lẩu Tứ Quý Logo" class="brand-logo-img"/>
                <div class="brand-name">Lẩu Tứ Quý</div>
                <div class="brand-subtitle">Restaurant Management</div>
            </div>
            <div class="sidebar-nav">
                <div class="nav-section-title">Khách hàng</div>
                <a th:href="@{/customer/menu}" class="nav-item">
                    <i class="bi bi-journal-text nav-icon"></i><span>Thực đơn</span>
                </a>
                <a th:href="@{/customer/booking}" class="nav-item active">
                    <i class="bi bi-calendar-plus-fill nav-icon"></i><span>Đặt bàn</span>
                </a>
                <a th:href="@{/customer/booking/history}" class="nav-item">
                    <i class="bi bi-clock-history nav-icon"></i><span>Lịch sử đặt bàn</span>
                </a>
                <a th:href="@{/customer/feedback}" class="nav-item">
                    <i class="bi bi-star-fill nav-icon"></i><span>Phản hồi</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                    <div class="user-avatar">
                        <span sec:authentication="name"
                            th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">C</span>
                    </div>
                    <div>
                        <div style="font-size:0.85rem; font-weight:600; color:var(--clr-text-primary);"
                            th:text="${#authentication.name}">Customer</div>
                        <div style="font-size:0.7rem; color:var(--clr-coral);">CUSTOMER</div>
                    </div>
                </div>
                <form th:action="@{/auth/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-secondary btn-sm btn-block" style="justify-content:center;">
                        <i class="bi bi-box-arrow-left"></i> Đăng xuất
                    </button>
                </form>
            </div>
        </nav>

        <div class="main-content">
            <header class="topbar">
                <div style="display:flex; align-items:center; gap:16px;">
                    <button id="sidebar-toggle" class="btn btn-secondary btn-sm"
                        style="display:none; padding:8px 10px;">
                        <i class="bi bi-list" style="font-size:1.2rem;"></i>
                    </button>
                    <div class="topbar-title">Đặt Bàn Trực Tuyến</div>
                </div>
            </header>

            <main class="page-content">
                <div th:if="${errorMessage}" class="alert alert-danger" data-auto-dismiss="true">
                    <i class="bi bi-exclamation-circle-fill"></i><span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/customer/booking}" method="post" th:object="${bookingRequest}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="grid-2 mb-xl">
                        <!-- Thông tin Đặt bàn -->
                        <div class="card">
                            <div class="card-header">
                                <h2 class="card-title"><i class="bi bi-person-lines-fill"
                                        style="color:var(--clr-gold);"></i> 1. Thông tin người đặt</h2>
                            </div>
                            <div class="card-body">
                                <div class="form-group">
                                    <label class="form-label" for="customerName">Họ và tên người đặt</label>
                                    <input type="text" id="customerName" th:field="*{customerName}" class="form-control"
                                        placeholder="Nguyễn Văn A" required />
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="customerPhone">Số điện thoại liên hệ</label>
                                    <input type="tel" id="customerPhone" th:field="*{customerPhone}"
                                        class="form-control" placeholder="0912345678" required />
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="tableTypeId">Loại bàn ước tính</label>
                                    <select id="tableTypeId" th:field="*{tableTypeId}" class="form-control" required>
                                        <option value="">-- Chọn loại bàn --</option>
                                        <option th:each="type : ${tableTypes}" th:value="${type.id}"
                                            th:text="'Bàn ' + ${type.capacity} + ' người (' + ${type.tableClass} + ')'">
                                        </option>
                                    </select>
                                </div>
                                <div class="grid-2">
                                    <div class="form-group">
                                        <label class="form-label" for="bookingDate">Ngày đặt</label>
                                        <input type="date" id="bookingDate" th:field="*{bookingDate}"
                                            class="form-control" required />
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="bookingTime">Giờ đến</label>
                                        <input type="time" id="bookingTime" th:field="*{bookingTime}"
                                            class="form-control" required />
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="specialNotes">Ghi chú đặc biệt</label>
                                    <textarea id="specialNotes" th:field="*{specialNotes}" class="form-control" rows="2"
                                        placeholder="Ví dụ: Cần góc yên tĩnh, sinh nhật..."></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Chọn món trước (Optional Preorders) -->
                        <div class="card">
                            <div class="card-header">
                                <h2 class="card-title"><i class="bi bi-egg-fried" style="color:var(--clr-coral);"></i>
                                    2. Chọn món trước (Tuỳ chọn)</h2>
                            </div>
                            <div class="card-body">
                                <p style="font-size:0.85rem; color:var(--clr-text-muted); margin-bottom:16px;">
                                    Chọn trước các món ăn yêu thích để nhà hàng chuẩn bị sẵn khi bạn tới!
                                </p>
                                <div style="max-height:360px; overflow-y:auto; padding-right:8px;">
                                    <div th:each="dish, iter : ${availableDishes}"
                                        style="display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--clr-border-light);">
                                        <div>
                                            <div th:text="${dish.name}"
                                                style="font-weight:600; color:var(--clr-text-primary);"></div>
                                            <div th:text="${#numbers.formatDecimal(dish.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"
                                                style="font-size:0.8rem; color:var(--clr-gold);"></div>
                                        </div>
                                        <div style="display:flex; align-items:center; gap:8px;">
                                            <input type="hidden" th:name="'preorders[' + ${iter.index} + '].dishId'"
                                                th:value="${dish.id}" />
                                            <input type="number" th:name="'preorders[' + ${iter.index} + '].quantity'"
                                                class="form-control" style="width:70px; text-align:center; padding:6px;"
                                                value="0" min="0" max="20" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div style="text-align:right;">
                        <button type="submit" class="btn btn-gold btn-lg">
                            <i class="bi bi-calendar-check-fill"></i> Xác Nhận Đặt Bàn
                        </button>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>

</html>
