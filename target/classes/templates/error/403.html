<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>403 — Truy cập bị từ chối | Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        .error-page {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background:
                radial-gradient(ellipse at center, rgba(118,0,49,0.3) 0%, transparent 60%),
                var(--clr-bg);
            text-align: center;
            padding: 24px;
        }
        .error-content { max-width: 480px; }
        .error-code {
            font-size: 8rem; font-weight: 900; line-height: 1;
            background: linear-gradient(135deg, var(--clr-crimson), var(--clr-coral));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(213,28,57,0.4));
        }
        .error-icon { font-size: 4rem; margin: 16px 0; animation: shake 0.5s ease 0.5s; }
        @keyframes shake {
            0%,100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }
    </style>
</head>
<body class="error-page">
    <div class="error-content">
        <div class="error-code">403</div>
        <div class="error-icon">🔒</div>
        <h1 style="font-size:1.5rem; font-weight:700; color:var(--clr-text-primary); margin-bottom:12px;">
            Truy cập bị từ chối
        </h1>
        <p style="color:var(--clr-text-muted); margin-bottom:32px; line-height:1.7;"
           th:text="${message ?: 'Bạn không có quyền truy cập vào trang này. Vui lòng đăng nhập với tài khoản phù hợp.'}">
        </p>
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <a th:href="@{/auth/login}" class="btn btn-primary">
                <i class="bi bi-box-arrow-in-right"></i> Đăng nhập lại
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Quay lại
            </a>
        </div>
        <div style="margin-top:24px; font-size:0.8rem; color:var(--clr-text-muted);">
            Nếu bạn cho rằng đây là lỗi, hãy liên hệ quản trị viên.
        </div>
    </div>
</body>
</html>
