<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>500 — Lỗi máy chủ | Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        .error-page {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background:
                radial-gradient(ellipse at bottom left, rgba(213,28,57,0.15) 0%, transparent 50%),
                var(--clr-bg);
            text-align: center; padding: 24px;
        }
        .error-content { max-width: 480px; }
        .error-code {
            font-size: 8rem; font-weight: 900; line-height: 1;
            background: linear-gradient(135deg, var(--clr-maroon-light), var(--clr-crimson));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .error-icon { font-size: 4rem; margin: 16px 0; }
        .pulse { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50%      { transform: scale(1.1); }
        }
    </style>
</head>
<body class="error-page">
    <div class="error-content">
        <div class="error-code">500</div>
        <div class="error-icon pulse">⚠️</div>
        <h1 style="font-size:1.5rem; font-weight:700; color:var(--clr-text-primary); margin-bottom:12px;">
            Lỗi máy chủ nội bộ
        </h1>
        <p style="color:var(--clr-text-muted); margin-bottom:32px; line-height:1.7;"
           th:text="${message ?: 'Đã xảy ra lỗi hệ thống không mong muốn. Đội ngũ kỹ thuật đã được thông báo. Vui lòng thử lại sau.'}">
        </p>
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <a th:href="@{/}" class="btn btn-primary">
                <i class="bi bi-house-fill"></i> Trang chủ
            </a>
            <a href="javascript:location.reload()" class="btn btn-secondary">
                <i class="bi bi-arrow-clockwise"></i> Thử lại
            </a>
        </div>
        <div style="margin-top:24px; font-size:0.75rem; color:var(--clr-text-muted);">
            Nếu lỗi tiếp tục xảy ra, vui lòng liên hệ: <span style="color:var(--clr-coral);">support@lautuquy.vn</span>
        </div>
    </div>
</body>
</html>
