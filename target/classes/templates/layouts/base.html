<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" th:content="${pageDescription ?: 'Hệ thống Quản lý Nhà hàng Lẩu Tứ Quý'}"/>
    <title th:text="${pageTitle != null ? pageTitle + ' — Lẩu Tứ Quý' : 'Lẩu Tứ Quý Management'}">Lẩu Tứ Quý</title>

    <!-- Design System CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <!-- Extra head content (có thể override từ page cụ thể) -->
    <th:block th:replace="~{${extraHead} ?: 'fragments/empty :: empty'}"/>
</head>
<body>

<!-- ====== SIDEBAR OVERLAY (Mobile) ====== -->
<div id="sidebar-overlay" class="sidebar-overlay"></div>

<div class="app-shell">
    <!-- ====== SIDEBAR ====== -->
    <nav class="sidebar" id="sidebar">
        <!-- Brand -->
        <div class="sidebar-brand">
            <span class="brand-icon">🍲</span>
            <div class="brand-name">Lẩu Tứ Quý</div>
            <div class="brand-subtitle">Restaurant Management</div>
        </div>

        <!-- Navigation theo Role -->
        <div class="sidebar-nav">

            <!-- ADMIN Navigation -->
            <th:block sec:authorize="hasRole('ADMIN')">
                <div class="nav-section-title">Quản trị viên</div>
                <a th:href="@{/admin/accounts}"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/admin/accounts') ? ' active' : ''}"
                   class="nav-item">
                    <i class="bi bi-people-fill nav-icon"></i>
                    <span>Tài khoản</span>
                </a>
                <a th:href="@{/admin/categories}"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/admin/categories') ? ' active' : ''}"
                   class="nav-item">
                    <i class="bi bi-grid-3x3-gap-fill nav-icon"></i>
                    <span>Danh mục</span>
                </a>
                <a th:href="@{/admin/dishes}"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/admin/dishes') ? ' active' : ''}"
                   class="nav-item">
                    <i class="bi bi-egg-fried nav-icon"></i>
                    <span>Thực đơn</span>
                </a>
                <a th:href="@{/admin/tables}"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/admin/tables') ? ' active' : ''}"
                   class="nav-item">
                    <i class="bi bi-table nav-icon"></i>
                    <span>Bàn ăn</span>
                </a>
                <a th:href="@{/admin/feedbacks}"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/admin/feedbacks') ? ' active' : ''}"
                   class="nav-item">
                    <i class="bi bi-chat-dots-fill nav-icon"></i>
                    <span>Phản hồi</span>
                </a>
                <a th:href="@{/admin/dashboard}"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/admin/dashboard') ? ' active' : ''}"
                   class="nav-item">
                    <i class="bi bi-bar-chart-fill nav-icon"></i>
                    <span>Báo cáo</span>
                </a>
            </th:block>

            <!-- STAFF Navigation -->
            <th:block sec:authorize="hasRole('STAFF')">
                <div class="nav-section-title">Nhân viên</div>
                <a th:href="@{/staff/bookings}"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/staff/bookings') ? ' active' : ''}"
                   class="nav-item">
                    <i class="bi bi-calendar-check-fill nav-icon"></i>
                    <span>Đặt bàn</span>
                </a>
                <a th:href="@{/staff/table-board}"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/staff/table-board') ? ' active' : ''}"
                   class="nav-item">
                    <i class="bi bi-grid-fill nav-icon"></i>
                    <span>Sơ đồ bàn</span>
                </a>
                <a th:href="@{/staff/orders}"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/staff/orders') ? ' active' : ''}"
                   class="nav-item">
                    <i class="bi bi-receipt nav-icon"></i>
                    <span>Gọi món</span>
                </a>
            </th:block>

            <!-- CUSTOMER Navigation -->
            <th:block sec:authorize="hasRole('CUSTOMER')">
                <div class="nav-section-title">Khách hàng</div>
                <a th:href="@{/customer/landing}"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/customer/landing') or #strings.startsWith(#httpServletRequest.requestURI, '/landing') ? ' active' : ''}"
                   class="nav-item">
                    <i class="bi bi-house-door-fill nav-icon"></i>
                    <span>Trang chủ</span>
                </a>
                <a th:href="@{/customer/booking}"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/customer/booking') ? ' active' : ''}"
                   class="nav-item">
                    <i class="bi bi-calendar-plus-fill nav-icon"></i>
                    <span>Đặt bàn</span>
                </a>
                <a th:href="@{/customer/feedback}"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/customer/feedback') ? ' active' : ''}"
                   class="nav-item">
                    <i class="bi bi-star-fill nav-icon"></i>
                    <span>Phản hồi</span>
                </a>
            </th:block>
        </div>

        <!-- Sidebar Footer — User info & Logout -->
        <div class="sidebar-footer">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                <div class="user-avatar" sec:authentication="name" style="font-size:0.8rem;">
                    <span th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                </div>
                <div>
                    <div style="font-size:0.85rem; font-weight:600; color:var(--clr-text-primary);"
                         th:text="${#authentication.name}">Username</div>
                    <div style="font-size:0.7rem; color:var(--clr-text-muted);"
                         sec:authentication="authorities">Role</div>
                </div>
            </div>
            <form th:action="@{/auth/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-secondary btn-sm btn-block"
                        style="justify-content:center; gap:8px;">
                    <i class="bi bi-box-arrow-left"></i> Đăng xuất
                </button>
            </form>
        </div>
    </nav>

    <!-- ====== MAIN CONTENT ====== -->
    <div class="main-content">
        <!-- Top Bar -->
        <header class="topbar">
            <div style="display:flex; align-items:center; gap:16px;">
                <!-- Mobile sidebar toggle -->
                <button id="sidebar-toggle" class="btn btn-secondary btn-sm"
                        style="display:none; padding:8px 10px;" aria-label="Menu">
                    <i class="bi bi-list" style="font-size:1.2rem;"></i>
                </button>
                <div>
                    <div class="topbar-title" th:text="${pageTitle ?: 'Dashboard'}">Dashboard</div>
                </div>
            </div>
            <div class="topbar-user">
                <span style="font-size:0.8rem; color:var(--clr-text-muted);"
                      th:text="'Xin chào, ' + ${#authentication.name}">Xin chào</span>
            </div>
        </header>

        <!-- Page Content -->
        <main class="page-content">
            <!-- Flash Messages -->
            <div th:if="${successMessage}" class="alert alert-success" data-auto-dismiss="true">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger" data-auto-dismiss="true">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <!-- Main Content Block (được override từ mỗi page) -->
            <th:block th:replace="~{${contentTemplate}}"/>
        </main>
    </div>
</div>

<!-- JavaScript -->
<script th:src="@{/js/main.js}"></script>
<th:block th:replace="~{${extraScript} ?: 'fragments/empty :: empty'}"/>

<!-- Mobile sidebar CSS -->
<style>
    .sidebar-overlay {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.6);
        z-index: 99;
        backdrop-filter: blur(4px);
    }
    .sidebar-overlay.active { display: block; }
    @media (max-width: 992px) {
        #sidebar-toggle { display: flex !important; }
    }
</style>

</body>
</html>
