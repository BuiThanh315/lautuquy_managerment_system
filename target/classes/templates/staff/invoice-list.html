<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle}">Danh Sách Hóa Đơn — Staff Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="app-shell">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img th:src="@{/images/logo.png}" alt="Lẩu Tứ Quý Logo" class="brand-logo-img"/>
                <div class="brand-name">Lẩu Tứ Quý</div>
                <div class="brand-subtitle">Restaurant Management</div>
            </div>
            <div class="sidebar-nav">
                <div class="nav-section-title">Nhân viên</div>
                <a th:href="@{/staff/bookings}" class="nav-item">
                    <i class="bi bi-journal-check nav-icon"></i><span>Duyệt đặt bàn</span>
                </a>
                <a th:href="@{/staff/table-board}" class="nav-item">
                    <i class="bi bi-border-all nav-icon"></i><span>Sơ đồ bàn ăn</span>
                </a>
                <a th:href="@{/staff/invoices}" class="nav-item active">
                    <i class="bi bi-receipt nav-icon"></i><span>Hóa đơn</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                    <div class="user-avatar" style="background:var(--clr-surface-3); color:var(--clr-text-primary);">
                        <span sec:authentication="name" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">S</span>
                    </div>
                    <div>
                        <div style="font-size:0.85rem; font-weight:600; color:var(--clr-text-primary);" th:text="${#authentication.name}">Staff</div>
                        <div style="font-size:0.7rem; color:var(--clr-gold);">STAFF</div>
                    </div>
                </div>
                <form th:action="@{/auth/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-secondary btn-sm btn-block" style="justify-content:center;">
                        <i class="bi bi-box-arrow-left"></i> Đăng xuất
                    </button>
                </form>
            </div>
        </nav>

        <div class="main-content">
            <header class="topbar">
                <div style="display:flex; align-items:center; gap:16px;">
                    <button id="sidebar-toggle" class="btn btn-secondary btn-sm" style="display:none; padding:8px 10px;">
                        <i class="bi bi-list" style="font-size:1.2rem;"></i>
                    </button>
                    <div class="topbar-title">Lịch Sử & Danh Sách Hóa Đơn Thanh Toán</div>
                </div>
            </header>

            <main class="page-content">

                <div class="card mb-xl">
                    <div class="card-header">
                        <h2 class="card-title">
                            <i class="bi bi-receipt-cutoff" style="color:var(--clr-gold);"></i>
                            Danh sách Hóa đơn
                        </h2>
                    </div>
                    <div class="table-wrapper">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Số HĐ</th>
                                    <th>Khách hàng</th>
                                    <th>Bàn ăn</th>
                                    <th>Tổng tiền</th>
                                    <th>Phương thức</th>
                                    <th>Trạng thái</th>
                                    <th>Thời gian</th>
                                    <th style="text-align:center;">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="inv : ${invoices}">
                                    <td><strong th:text="'#' + ${inv.id}"></strong></td>
                                    <td>
                                        <div style="font-weight:600;" th:text="${inv.order.account != null ? inv.order.account.fullName : 'Khách vãng lai'}"></div>
                                        <div style="font-size:0.75rem; color:var(--clr-text-muted);" th:text="${inv.order.account != null ? inv.order.account.username : '—'}"></div>
                                    </td>
                                    <td th:text="${inv.order.table != null ? 'Bàn ' + inv.order.table.tableNumber : '—'}"></td>
                                    <td style="font-weight:700; color:var(--clr-gold);" th:text="${#numbers.formatDecimal(inv.finalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                    <td th:text="${inv.paymentMethod}"></td>
                                    <td>
                                        <span class="badge" th:classappend="${inv.paymentStatus.name() == 'PAID' ? 'badge-seated' : 'badge-pending'}"
                                              th:text="${inv.paymentStatus.name() == 'PAID' ? 'ĐÃ THANH TOÁN' : 'CHỜ THANH TOÁN'}"></span>
                                    </td>
                                    <td th:text="${inv.createdAt != null ? #temporals.format(inv.createdAt, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                                    <td style="text-align:center;">
                                        <a th:href="@{/staff/invoices/{id}/print(id=${inv.id})}" class="btn btn-secondary btn-sm">
                                            <i class="bi bi-printer-fill"></i> In HĐ
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${invoices == null || invoices.isEmpty()}">
                                    <td colspan="8" style="text-align:center; padding:36px; color:var(--clr-text-muted);">
                                        Chưa có hóa đơn nào được khởi tạo.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>

</html>
