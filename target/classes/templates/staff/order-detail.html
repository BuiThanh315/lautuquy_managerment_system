<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gọi Món Tại Bàn — Lẩu Tứ Quý</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="app-shell">
        <!-- SIDEBAR STAFF -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img th:src="@{/images/logo.png}" alt="Lẩu Tứ Quý Logo" class="brand-logo-img" />
                <div class="brand-name">Lẩu Tứ Quý</div>
                <div class="brand-subtitle">Restaurant Management</div>
            </div>
            <div class="sidebar-nav">
                <div class="nav-section-title">Nhân viên</div>
                <a th:href="@{/staff/bookings}" class="nav-item active">
                    <i class="bi bi-calendar-check-fill nav-icon"></i><span>Duyệt đặt bàn</span>
                </a>
                <a th:href="@{/staff/table-board}" class="nav-item">
                    <i class="bi bi-grid-3x3-gap-fill nav-icon"></i><span>Sơ đồ bàn ăn</span>
                </a>
            </div>
            <div class="sidebar-footer">
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                    <div class="user-avatar">
                        <span sec:authentication="name"
                            th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">S</span>
                    </div>
                    <div>
                        <div style="font-size:0.85rem; font-weight:600; color:var(--clr-text-primary);"
                            th:text="${#authentication.name}">Staff</div>
                        <div style="font-size:0.7rem; color:var(--clr-coral);" sec:authentication="principal.authorities">STAFF</div>
                    </div>
                </div>
                <form th:action="@{/auth/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-secondary btn-sm btn-block" style="justify-content:center;">
                        <i class="bi bi-box-arrow-left"></i> Đăng xuất
                    </button>
                </form>
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <header class="topbar">
                <div style="display:flex; align-items:center; gap:16px;">
                    <button id="sidebar-toggle" class="btn btn-secondary btn-sm"
                        style="display:none; padding:8px 10px;">
                        <i class="bi bi-list" style="font-size:1.2rem;"></i>
                    </button>
                    <div>
                        <div class="topbar-title" th:text="'Chi Tiết Gọi Món — ' + (${booking.assignedTable != null} ? 'Bàn ' + ${booking.assignedTable.tableNumber} : 'Đơn #' + ${booking.id})"></div>
                    </div>
                </div>
                <a th:href="@{/staff/bookings}" class="btn btn-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i> Quay lại
                </a>
            </header>

            <main class="page-content">

                <!-- Flash Messages -->
                <div th:if="${successMessage}" class="alert alert-success" data-auto-dismiss="true">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger" data-auto-dismiss="true">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <!-- Info Header Card -->
                <div class="card mb-lg" style="padding:20px;">
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:16px;">
                        <div>
                            <span style="font-size:0.75rem; color:var(--clr-text-muted); text-transform:uppercase;">Khách hàng</span>
                            <div style="font-weight:600; font-size:1.05rem;" th:text="${booking.customerName}"></div>
                        </div>
                        <div>
                            <span style="font-size:0.75rem; color:var(--clr-text-muted); text-transform:uppercase;">Số điện thoại</span>
                            <div style="font-weight:600; font-size:1.05rem;" th:text="${booking.customerPhone}"></div>
                        </div>
                        <div>
                            <span style="font-size:0.75rem; color:var(--clr-text-muted); text-transform:uppercase;">Bàn ăn</span>
                            <div style="font-weight:700; font-size:1.05rem; color:var(--clr-gold);"
                                th:text="${booking.assignedTable != null} ? 'Bàn ' + ${booking.assignedTable.tableNumber} : 'Chưa xếp'"></div>
                        </div>
                        <div>
                            <span style="font-size:0.75rem; color:var(--clr-text-muted); text-transform:uppercase;">Trạng thái đơn</span>
                            <div><span class="badge badge-seated" th:text="${order.status}">PROCESSING</span></div>
                        </div>
                    </div>
                </div>

                <div class="grid-3">
                    <!-- Form Thêm Món (Trái / Trên đối với mobile) -->
                    <div class="card" style="grid-column: span 1; height:fit-content;">
                        <div class="card-header">
                            <h3 class="card-title" style="font-size:1rem;">
                                <i class="bi bi-plus-circle-fill" style="color:var(--clr-gold);"></i> Thêm Món Vào Đơn
                            </h3>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/staff/orders/{orderId}/items/add(orderId=${order.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <input type="hidden" name="bookingId" th:value="${booking.id}" />

                                <div class="form-group">
                                    <label class="form-label" for="dishId">Chọn món ăn</label>
                                    <select name="dishId" id="dishId" class="form-select" required>
                                        <option value="">-- Chọn món --</option>
                                        <option th:each="d : ${availableDishes}" th:value="${d.id}"
                                            th:text="${d.name} + ' (' + ${#numbers.formatDecimal(d.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ)'">
                                        </option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label" for="quantity">Số lượng</label>
                                    <input type="number" name="quantity" id="quantity" class="form-control" value="1" min="1" max="99" required />
                                </div>

                                <button type="submit" class="btn btn-primary btn-block">
                                    <i class="bi bi-cart-plus-fill"></i> Thêm vào đơn
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Danh Sách Món Đã Gọi (Phải / Dưới đối với mobile) -->
                    <div class="card" style="grid-column: span 2;">
                        <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
                            <h3 class="card-title" style="font-size:1rem;">
                                <i class="bi bi-receipt" style="color:var(--clr-coral);"></i> Danh Sách Món Đã Gọi
                            </h3>
                        </div>
                        <div class="table-wrapper">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Món ăn</th>
                                        <th>Giá gọi món</th>
                                        <th>Số lượng</th>
                                        <th>Thành tiền</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${order.orderItems}">
                                        <td>
                                            <div style="font-weight:600; color:var(--clr-text-primary);" th:text="${item.dish.name}"></div>
                                            <span style="font-size:0.75rem; color:var(--clr-text-muted);" th:text="${item.dish.category.name}"></span>
                                        </td>
                                        <td th:text="${#numbers.formatDecimal(item.actualPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                        <td style="width:120px;">
                                            <form th:action="@{/staff/orders/items/{itemId}/update(itemId=${item.id})}" method="post" style="display:flex; gap:4px;">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <input type="hidden" name="bookingId" th:value="${booking.id}" />
                                                <input type="number" name="quantity" th:value="${item.quantity}" min="1" max="99" class="form-control form-control-sm" style="padding:4px 8px; text-align:center;" />
                                                <button type="submit" class="btn btn-secondary btn-sm" title="Lưu số lượng"><i class="bi bi-check"></i></button>
                                            </form>
                                        </td>
                                        <td style="font-weight:700; color:var(--clr-gold);"
                                            th:text="${#numbers.formatDecimal(item.actualPrice * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                        <td>
                                            <form th:action="@{/staff/orders/items/{itemId}/remove(itemId=${item.id})}" method="post" style="display:inline;">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                <input type="hidden" name="bookingId" th:value="${booking.id}" />
                                                <button type="submit" class="btn btn-danger btn-sm" title="Xóa món">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${order.orderItems.isEmpty()}">
                                        <td colspan="5" style="text-align:center; padding:36px; color:var(--clr-text-muted);">
                                            Chưa có món ăn nào trong đơn.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="card-footer" style="display:flex; justify-content:space-between; align-items:center; background:var(--clr-surface-2); padding:16px 24px; border-top:1px solid var(--clr-border);">
                            <span style="font-weight:600; font-size:1.1rem;">TỔNG CỘNG HÓA ĐƠN:</span>
                            <span style="font-weight:800; font-size:1.4rem; color:var(--clr-coral);"
                                th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</span>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
    <style>
        .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:99; }
        .sidebar-overlay.active { display:block; }
        @media (max-width:992px) { #sidebar-toggle { display:flex !important; } }
    </style>
</body>

</html>
